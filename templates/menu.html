<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu - The Royal Spice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
        .card-custom { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }
        .menu-img { height: 160px; object-fit: cover; width: 100%; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: #161b22; border-top: 2px solid #f39c12; padding: 12px 20px; z-index: 1000; }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-warning"><i class="fa-solid fa-utensils"></i> THE ROYAL SPICE</h1>
            <p class="text-secondary mb-0">Scan, Select & Order Fresh Food Directly to Your Table</p>
        </div>

        <!-- Category Filters -->
        <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <button class="btn btn-warning fw-bold" onclick="filterMenu('all')">All Items</button>
            <button class="btn btn-outline-warning fw-bold" onclick="filterMenu('Starters')">Starters</button>
            <button class="btn btn-outline-warning fw-bold" onclick="filterMenu('Main Course')">Main Course</button>
            <button class="btn btn-outline-warning fw-bold" onclick="filterMenu('Desserts')">Desserts</button>
            <button class="btn btn-outline-warning fw-bold" onclick="filterMenu('Beverages')">Beverages</button>
        </div>

        <!-- Menu Grid -->
        <div class="row g-3" id="menuGrid">
            <!-- Dishes loaded via JS -->
        </div>

        <!-- ⭐ Customer Feedback Button -->
        <div class="text-center my-5">
            <button class="btn btn-outline-warning btn-lg fw-bold" data-bs-toggle="modal" data-bs-target="#feedbackModal">
                <i class="fa-solid fa-star text-warning"></i> Rate Experience & Give Feedback
            </button>
        </div>
    </div>

    <!-- Bottom Cart Bar -->
    <div class="cart-bar d-flex justify-content-between align-items-center">
        <div>
            <span class="text-secondary small">Total Items: <strong class="text-white" id="cartCount">0</strong></span>
            <h4 class="text-success fw-bold m-0">₹<span id="cartTotal">0</span></h4>
        </div>
        <button class="btn btn-warning btn-lg fw-bold px-4" data-bs-toggle="modal" data-bs-target="#orderModal" id="checkoutBtn" disabled>
            Place Order <i class="fa-solid fa-arrow-right ms-1"></i>
        </button>
    </div>

    <!-- Place Order Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold"><i class="fa-solid fa-receipt"></i> Confirm Your Order</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small">Your Name</label>
                        <input type="text" id="cust_name" class="form-control bg-secondary text-white border-0" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Table Number</label>
                        <input type="number" id="table_no" class="form-control bg-secondary text-white border-0" placeholder="e.g. 5" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Phone Number (Optional)</label>
                        <input type="tel" id="cust_phone" class="form-control bg-secondary text-white border-0" placeholder="e.g. 9876543210">
                    </div>
                    <hr class="border-secondary">
                    <h6>Order Summary:</h6>
                    <div id="modalCartItems" class="small text-light opacity-75 mb-2"></div>
                    <div class="d-flex justify-content-between fw-bold fs-5 text-success">
                        <span>Total Payable:</span>
                        <span>₹<span id="modalCartTotal">0</span></span>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-warning w-100 fw-bold" onclick="submitOrder()">Confirm & Send to Kitchen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Feedback Modal -->
    <div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold"><i class="fa-solid fa-star"></i> Rate & Review Us</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small">Your Name</label>
                        <input type="text" id="rev_name" class="form-control bg-secondary text-white border-0" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Rating</label>
                        <select id="rev_rating" class="form-select bg-secondary text-white border-0">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5) Excellent</option>
                            <option value="4">⭐⭐⭐⭐ (4/5) Very Good</option>
                            <option value="3">⭐⭐⭐ (3/5) Good</option>
                            <option value="2">⭐⭐ (2/5) Average</option>
                            <option value="1">⭐ (1/5) Poor</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Comments / Feedback</label>
                        <textarea id="rev_comment" class="form-control bg-secondary text-white border-0" rows="3" placeholder="Tell us about the food and service..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-warning w-100 fw-bold" onclick="submitReview()">Submit Feedback</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dishes = [
            { id: 1, name: "Paneer Butter Masala", price: 240, category: "Main Course", img: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=500" },
            { id: 2, name: "Chicken Biryani", price: 280, category: "Main Course", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500" },
            { id: 3, name: "Veg Crispy Starter", price: 180, category: "Starters", img: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?w=500" },
            { id: 4, name: "Gulab Jamun (2 Pcs)", price: 90, category: "Desserts", img: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?w=500" },
            { id: 5, name: "Fresh Lime Soda", price: 70, category: "Beverages", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500" },
            { id: 6, name: "Chicken Tikka Starter", price: 260, category: "Starters", img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=500" }
        ];

        let cart = {};

        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            items.forEach(dish => {
                grid.innerHTML += `
                    <div class="col-md-4 col-6">
                        <div class="card card-custom h-100">
                            <img src="${dish.img}" class="menu-img" alt="${dish.name}">
                            <div class="p-3 d-flex flex-column justify-content-between">
                                <div>
                                    <span class="badge bg-secondary mb-1">${dish.category}</span>
                                    <h6 class="fw-bold text-white mb-1">${dish.name}</h6>
                                    <h6 class="text-success fw-bold">₹${dish.price}</h6>
                                </div>
                                <div class="mt-2 d-flex justify-content-between align-items-center">
                                    <button class="btn btn-sm btn-outline-warning" onclick="changeQty(${dish.id}, -1)">-</button>
                                    <span class="fw-bold text-warning" id="qty-${dish.id}">0</span>
                                    <button class="btn btn-sm btn-warning" onclick="changeQty(${dish.id}, 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterMenu(cat) {
            if (cat === 'all') renderMenu(dishes);
            else renderMenu(dishes.filter(d => d.category === cat));
        }

        function changeQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] <= 0) delete cart[id];
            updateCart();
        }

        function updateCart() {
            let total = 0;
            let count = 0;
            let itemsHTML = '';

            for (let id in cart) {
                const dish = dishes.find(d => d.id == id);
                if (dish) {
                    total += dish.price * cart[id];
                    count += cart[id];
                    itemsHTML += `<div>${dish.name} x ${cart[id]} = ₹${dish.price * cart[id]}</div>`;
                }
                const qtyElem = document.getElementById(`qty-${id}`);
                if (qtyElem) qtyElem.innerText = cart[id];
            }

            dishes.forEach(d => {
                if (!cart[d.id]) {
                    const qtyElem = document.getElementById(`qty-${d.id}`);
                    if (qtyElem) qtyElem.innerText = 0;
                }
            });

            document.getElementById('cartTotal').innerText = total;
            document.getElementById('cartCount').innerText = count;
            document.getElementById('modalCartTotal').innerText = total;
            document.getElementById('modalCartItems').innerHTML = itemsHTML || 'No items selected';
            document.getElementById('checkoutBtn').disabled = count === 0;
        }

        async function submitOrder() {
            const name = document.getElementById('cust_name').value;
            const table = document.getElementById('table_no').value;
            const phone = document.getElementById('cust_phone').value;

            if (!name || !table) {
                alert('Please enter Name and Table Number!');
                return;
            }

            let orderItems = [];
            let total = 0;
            for (let id in cart) {
                const dish = dishes.find(d => d.id == id);
                if (dish) {
                    orderItems.push({ name: dish.name, price: dish.price, qty: cart[id] });
                    total += dish.price * cart[id];
                }
            }

            const res = await fetch('/api/place-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, table_no: table, phone, items: orderItems, total })
            });

            const data = await res.json();
            if (data.success) {
                alert('🎉 Order Placed Successfully! Order #' + data.order_id);
                location.reload();
            }
        }

        async function submitReview() {
            const name = document.getElementById('rev_name').value || 'Guest';
            const rating = document.getElementById('rev_rating').value;
            const comment = document.getElementById('rev_comment').value;

            if(!comment) {
                alert('Please enter a brief feedback comment.');
                return;
            }

            await fetch('/api/submit-review', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, rating, comment })
            });

            alert('Thank you for your valuable feedback! 🌸');
            location.reload();
        }

        renderMenu(dishes);
    </script>
</body>
</html>
