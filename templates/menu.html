<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu | The Royal Spice</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { 
            background: #0f172a;
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding-bottom: 110px; 
            min-height: 100vh;
        }
        .hero-section { 
            background: rgba(15, 23, 42, 0.9); 
            padding: 16px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .category-scroll { scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .btn-filter {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 50px;
        }
        .btn-filter:hover, .btn-filter.active {
            background: #f59e0b;
            color: #0f172a;
        }
        .search-box {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
            border-radius: 30px !important;
            padding: 10px 20px !important;
        }
        .dish-card { 
            background: rgba(30, 41, 59, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            padding: 16px;
        }
        .badge-veg-dot {
            width: 14px; height: 14px; border: 2px solid #22c55e;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 3px;
        }
        .badge-veg-dot::after {
            content: ''; width: 6px; height: 6px; background: #22c55e; border-radius: 50%;
        }
        .badge-nonveg-dot {
            width: 14px; height: 14px; border: 2px solid #ef4444;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 3px;
        }
        .badge-nonveg-dot::after {
            content: ''; width: 0; height: 0;
            border-left: 3px solid transparent; border-right: 3px solid transparent;
            border-bottom: 6px solid #ef4444;
        }
        .taste-select {
            background-color: #0f172a !important;
            color: #f59e0b !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            font-size: 13px;
        }
        .cart-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #0f172a; border-top: 1px solid #f59e0b; 
            padding: 14px 24px; z-index: 1000; 
        }
    </style>
</head>
<body>

    <div class="hero-section sticky-top mb-4">
        <div class="container text-center">
            <h4 class="fw-bold text-warning m-0">
                <i class="fa-solid fa-crown me-1"></i> THE ROYAL SPICE
            </h4>
            <span class="text-secondary small">Digital Menu</span>
        </div>
    </div>

    <div class="container">
        <!-- Search Bar -->
        <div class="row justify-content-center mb-3">
            <div class="col-md-6 col-12">
                <input type="text" id="searchInput" class="form-control search-box" placeholder="Search dish..." onkeyup="applyFilters()">
            </div>
        </div>

        <!-- Category Filters -->
        <div class="d-flex gap-2 mb-4 overflow-auto pb-2 category-scroll justify-content-start justify-content-md-center">
            <button class="btn btn-filter active" onclick="filterCategory('all', this)">All</button>
            <button class="btn btn-filter" onclick="filterCategory('Starters', this)">Starters</button>
            <button class="btn btn-filter" onclick="filterCategory('Main Course', this)">Main Course</button>
            <button class="btn btn-filter" onclick="filterCategory('Roti & Breads', this)">Roti & Breads</button>
            <button class="btn btn-filter" onclick="filterCategory('Rice & Biryani', this)">Rice & Biryani</button>
            <button class="btn btn-filter" onclick="filterCategory('Desserts & Drinks', this)">Desserts & Drinks</button>
        </div>

        <!-- Dishes Grid -->
        <div class="row g-3" id="menuGrid"></div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-bar d-flex justify-content-between align-items-center">
        <div>
            <span class="text-secondary small fw-bold">Cart: <strong class="text-warning" id="cartCount">0 Items</strong></span>
            <h4 class="text-success fw-bold m-0">₹<span id="cartTotal">0</span></h4>
        </div>
        <button class="btn btn-warning fw-bold rounded-pill px-4" id="checkoutBtn" disabled onclick="alert('ऑर्डर सबमिट झाली!')">Place Order</button>
    </div>

    <script>
        
        // 📋 सर्व कॅटेगरीमध्ये ७-८ पदार्थ असलेला अपडेटेड मेनू
const allMenuItems = [
    // --- 1. Starters (8 Items) ---
    { id: 1, name: "Paneer Tikka", half_price: 130, full_price: 240, category: "Starters" },
    { id: 2, name: "Paneer Chilli", half_price: 135, full_price: 250, category: "Starters" },
    { id: 3, name: "Hara Bhara Kebab", half_price: 100, full_price: 190, category: "Starters" },
    { id: 4, name: "Veg Crispy", half_price: 110, full_price: 200, category: "Starters" },
    { id: 5, name: "Chicken Tikka", half_price: 160, full_price: 300, category: "Starters" },
    { id: 6, name: "Chicken Tandoori", half_price: 220, full_price: 420, category: "Starters" },
    { id: 7, name: "Chicken Chilli", half_price: 150, full_price: 280, category: "Starters" },
    { id: 8, name: "Chicken Lollipop", half_price: 140, full_price: 260, category: "Starters" },

    // --- 2. Main Course (8 Items) ---
    { id: 9, name: "Paneer Butter Masala", half_price: 140, full_price: 260, category: "Main Course" },
    { id: 10, name: "Paneer Kadhai", half_price: 140, full_price: 260, category: "Main Course" },
    { id: 11, name: "Veg Kolhapuri", half_price: 120, full_price: 220, category: "Main Course" },
    { id: 12, name: "Dal Tadka", half_price: 90, full_price: 160, category: "Main Course" },
    { id: 13, name: "Kaju Curry", half_price: 160, full_price: 290, category: "Main Course" },
    { id: 14, name: "Butter Chicken", half_price: 170, full_price: 320, category: "Main Course" },
    { id: 15, name: "Chicken Masala", half_price: 150, full_price: 280, category: "Main Course" },
    { id: 16, name: "Mutton Curry", half_price: 200, full_price: 380, category: "Main Course" },

    // --- 3. Roti & Breads (7 Items) ---
    { id: 17, name: "Tandoori Roti", half_price: 0, full_price: 20, category: "Roti & Breads" },
    { id: 18, name: "Butter Roti", half_price: 0, full_price: 25, category: "Roti & Breads" },
    { id: 19, name: "Plain Naan", half_price: 0, full_price: 35, category: "Roti & Breads" },
    { id: 20, name: "Butter Naan", half_price: 0, full_price: 45, category: "Roti & Breads" },
    { id: 21, name: "Garlic Naan", half_price: 0, full_price: 55, category: "Roti & Breads" },
    { id: 22, name: "Cheese Garlic Naan", half_price: 0, full_price: 80, category: "Roti & Breads" },
    { id: 23, name: "Missi Roti", half_price: 0, full_price: 35, category: "Roti & Breads" },

    // --- 4. Rice & Biryani (7 Items) ---
    { id: 24, name: "Steam Rice", half_price: 50, full_price: 90, category: "Rice & Biryani" },
    { id: 25, name: "Jeera Rice", half_price: 70, full_price: 130, category: "Rice & Biryani" },
    { id: 26, name: "Dal Khichdi", half_price: 95, full_price: 170, category: "Rice & Biryani" },
    { id: 27, name: "Veg Dum Biryani", half_price: 110, full_price: 200, category: "Rice & Biryani" },
    { id: 28, name: "Veg Pulao", half_price: 100, full_price: 180, category: "Rice & Biryani" },
    { id: 29, name: "Chicken Dum Biryani", half_price: 140, full_price: 260, category: "Rice & Biryani" },
    { id: 30, name: "Mutton Biryani", half_price: 180, full_price: 340, category: "Rice & Biryani" },

    // --- 5. Desserts & Drinks (7 Items) ---
    { id: 31, name: "Masala Taak (Buttermilk)", half_price: 0, full_price: 25, category: "Desserts & Drinks" },
    { id: 32, name: "Cold Drink (Soft Drink)", half_price: 0, full_price: 30, category: "Desserts & Drinks" },
    { id: 33, name: "Fresh Lime Soda", half_price: 0, full_price: 45, category: "Desserts & Drinks" },
    { id: 34, name: "Gulab Jamun (2 Pcs)", half_price: 0, full_price: 50, category: "Desserts & Drinks" },
    { id: 35, name: "Vanilla Ice Cream", half_price: 0, full_price: 60, category: "Desserts & Drinks" },
    { id: 36, name: "Chocolate Ice Cream", half_price: 0, full_price: 70, category: "Desserts & Drinks" },
    { id: 37, name: "Sizzling Brownie with Ice Cream", half_price: 0, full_price: 140, category: "Desserts & Drinks" }
];

        let dishes = [];
        let cart = [];
        let currentCategory = 'all';

        function processMenuData(rawMenu) {
            const nonVegKeywords = ['chicken', 'mutton', 'fish', 'prawn', 'egg'];
            return rawMenu.map(item => ({
                id: item.id,
                name: item.name,
                category: item.category,
                type: nonVegKeywords.some(kw => item.name.toLowerCase().includes(kw)) ? 'nonveg' : 'veg',
                halfPrice: item.half_price > 0 ? item.half_price : null,
                fullPrice: item.full_price,
                hasTaste: !['Roti & Breads', 'Desserts & Drinks'].includes(item.category)
            }));
        }

        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if(!items || items.length === 0) {
                grid.innerHTML = `<div class="text-center text-secondary py-4">कोणतेही पदार्थ सापडले नाहीत.</div>`;
                return;
            }

            items.forEach(dish => {
                const badge = dish.type === 'veg' ? '<span class="badge-veg-dot"></span>' : '<span class="badge-nonveg-dot"></span>';
                let portionHTML = dish.halfPrice ? 
                    `<div class="btn-group btn-group-sm w-100 my-2">
                        <input type="radio" class="btn-check" name="portion-${dish.id}" id="half-${dish.id}" checked>
                        <label class="btn btn-outline-warning py-1" for="half-${dish.id}">Half ₹${dish.halfPrice}</label>
                        <input type="radio" class="btn-check" name="portion-${dish.id}" id="full-${dish.id}">
                        <label class="btn btn-outline-warning py-1" for="full-${dish.id}">Full ₹${dish.fullPrice}</label>
                    </div>` : 
                    `<div class="text-warning fw-bold my-2">Full: ₹${dish.fullPrice}</div>`;

                grid.innerHTML += `
                    <div class="col-md-6 col-12">
                        <div class="dish-card">
                            <h6 class="fw-bold text-white d-flex align-items-center gap-2 m-0">${badge} ${dish.name}</h6>
                            ${portionHTML}
                            <button class="btn btn-warning w-100 fw-bold rounded-3 mt-2" onclick="addToCart(${dish.id})">+ Add</button>
                        </div>
                    </div>`;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = dishes;
            if (currentCategory !== 'all') filtered = filtered.filter(d => d.category === currentCategory);
            if (query !== '') filtered = filtered.filter(d => d.name.toLowerCase().includes(query));
            renderMenu(filtered);
        }

        function addToCart(id) {
            const dish = dishes.find(d => d.id === id);
            cart.push(dish);
            document.getElementById('cartCount').innerText = cart.length + " Items";
            document.getElementById('cartTotal').innerText = cart.reduce((sum, item) => sum + item.fullPrice, 0);
            document.getElementById('checkoutBtn').disabled = false;
        }

        // 🔥 पेज लोड होताच मेनू ऑटोमॅटिक लोड होईल
        window.onload = function() {
            dishes = processMenuData(allMenuItems);
            renderMenu(dishes);
        };
    </script>
    <script>
async function loadMenuItems() {
    try {
        const response = await fetch('/api/menu');
        const data = await response.json();
        
        if (data.success) {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = ''; // जुना डेटा क्लिअर करा

            data.menu.forEach(item => {
                menuContainer.innerHTML += `
                    <div class="menu-card">
                        <h3>${item.name}</h3>
                        <p>वर्ग: ${item.category}</p>
                        <p>हाफ प्राईस: ₹${item.half_price}</p>
                        <p>फूल प्राईस: ₹${item.full_price}</p>
                    </div>
                `;
            });
        }
    } catch (error) {
        console.error("Menu loading error:", error);
    }
}

// पेज लोड झाल्यावर मेन्यू ऑटोमॅटिक फेच करा
window.onload = loadMenuItems;
</script>
</body>
</html>
