<!DOCTYPE html>
<html lang="mr">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu | The Royal Spice</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #0b1120;
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding-bottom: 120px; 
            min-height: 100vh;
        }
        .hero-section { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 18px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .category-scroll { scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .btn-filter {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 50px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .btn-filter:hover, .btn-filter.active {
            background: #f59e0b;
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .search-box {
            background: rgba(30, 41, 59, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 30px !important;
            padding: 12px 22px !important;
        }
        .dish-card { 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 18px; 
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .dish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .dish-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .badge-veg-dot, .badge-nonveg-dot {
            width: 16px; height: 16px; border-radius: 3px;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .badge-veg-dot { border: 2px solid #22c55e; }
        .badge-veg-dot::after { content: ''; width: 6px; height: 6px; background: #22c55e; border-radius: 50%; }
        .badge-nonveg-dot { border: 2px solid #ef4444; }
        .badge-nonveg-dot::after {
            content: ''; width: 0; height: 0;
            border-left: 3px solid transparent; border-right: 3px solid transparent;
            border-bottom: 6px solid #ef4444;
        }
        .bestseller-badge {
            position: absolute; top: 10px; right: 10px;
            background: #ef4444; color: #fff;
            font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 2;
        }
        .cart-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(245, 158, 11, 0.3); 
            padding: 16px 24px; z-index: 1000; 
        }
        .offcanvas-custom {
            background: #0f172a;
            color: #fff;
            border-left: 1px solid rgba(245, 158, 11, 0.3);
        }
        .cart-item-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="hero-section sticky-top mb-4">
        <div class="container text-center">
            <h4 class="fw-bold text-warning m-0">
                <i class="fa-solid fa-crown me-2"></i>THE ROYAL SPICE
            </h4>
            <span class="text-secondary small">Digital Menu</span>
        </div>
    </div>

    <div class="container">
        <!-- Search Bar -->
        <div class="row justify-content-center mb-3">
            <div class="col-md-6 col-12">

            </div>
        </div>

        <!-- Veg/Non-Veg Quick Filter Buttons -->
        <div class="d-flex justify-content-center gap-2 mb-3">
            <button class="btn btn-sm btn-outline-success rounded-pill px-3" onclick="typeFilter('veg')">🟢 Veg Only</button>
            <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="typeFilter('nonveg')">🔴 Non-Veg Only</button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="typeFilter('all')">Show All</button>
        </div>

        <!-- Category Filters -->
        <div class="d-flex gap-2 mb-4 overflow-auto pb-2 category-scroll justify-content-start justify-content-md-center">
            <button class="btn btn-filter active" onclick="filterCategory('all', this)">All</button>
            <button class="btn btn-filter" onclick="filterCategory('Starters', this)">🍢 Starters</button>
            <button class="btn btn-filter" onclick="filterCategory('Main Course', this)">🥘 Main Course</button>
            <button class="btn btn-filter" onclick="filterCategory('Roti & Breads', this)">🫓 Roti & Breads</button>
            <button class="btn btn-filter" onclick="filterCategory('Rice & Biryani', this)">🍲 Rice & Biryani</button>
            <button class="btn btn-filter" onclick="filterCategory('Desserts & Drinks', this)">🥤 Desserts & Drinks</button>
        </div>

        <!-- Dishes Grid -->
        <div class="row g-3" id="menuGrid"></div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-bar d-flex justify-content-between align-items-center">
        <div>
            <span class="text-secondary small fw-bold">Selected Items: <strong class="text-warning" id="cartCount">0 Items</strong></span>
            <h4 class="text-success fw-bold m-0">₹<span id="cartTotal">0</span></h4>
        </div>
        <button class="btn btn-warning fw-bold rounded-pill px-4 shadow" id="viewCartBtn" disabled data-bs-toggle="offcanvas" data-bs-target="#slideCart">
            View Cart & Order <i class="fa-solid fa-cart-shopping ms-1"></i>
        </button>
    </div>

    <!-- Slide-in Cart Drawer -->
    <div class="offcanvas offcanvas-end offcanvas-custom" tabindex="-1" id="slideCart" aria-labelledby="slideCartLabel">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title text-warning fw-bold" id="slideCartLabel">
                <i class="fa-solid fa-basket-shopping me-2"></i>Your Order
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <div id="cartItemsContainer" class="overflow-auto pe-1">
                <div class="text-center text-secondary py-5">तुमच्या कार्टमध्ये कोणतेही पदार्थ नाहीत.</div>
            </div>

            <div class="border-top border-secondary pt-3 mt-3">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Table Number</label>
                    <input type="number" id="tableNumber" class="form-control bg-dark text-white border-secondary" placeholder="उदा. 05">
                </div>
                
                <div class="d-flex justify-content-between text-white fw-bold fs-5 mb-3">
                    <span>Total Amount:</span>
                    <span class="text-success">₹<span id="drawerTotal">0</span></span>
                </div>

                <button class="btn btn-warning w-100 fw-bold py-2 rounded-3" onclick="submitOrder()">
                    <i class="fa-solid fa-paper-plane me-1"></i> Send Order
                </button>
            </div>
        </div>
    </div>

        let dishes = [];

        // 🧠 स्मार्ट अ‍ॅनालिसिस फाईंडर - नामावरून इमेज युआरएल तयार करणे
        function getDishImage(dishName, imgKey) {
            if (imgKey) {
                return `https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80&fit=crop&sig=${imgKey}`; // Dynamic unique image fallback
            }
            const cleanName = encodeURIComponent(dishName.toLowerCase().replace(/[^a-z0-9 ]/g, ""));
            return `https://source.unsplash.com/400x300/?${cleanName}`;
        }

        function processMenuData(rawMenu) {
            const nonVegKeywords = ['chicken', 'mutton', 'fish', 'prawn', 'egg'];
            const bestsellerList = ['Paneer Butter Masala', 'Butter Chicken', 'Chicken Dum Biryani', 'Dal Tadka', 'Sizzling Brownie with Ice Cream'];

            return rawMenu.map(item => {
                const isNonVeg = nonVegKeywords.some(kw => item.name.toLowerCase().includes(kw));
                const key = item.imgKey || item.name.toLowerCase().replace(/\s+/g, '-');
                
                return {
                    id: item.id,
                    name: item.name,
                    category: item.category || 'General',
                    type: isNonVeg ? 'nonveg' : 'veg',
                    isBestseller: bestsellerList.includes(item.name),
                    halfPrice: item.half_price > 0 ? item.half_price : null,
                    fullPrice: item.full_price,
                    image: `https://loremflickr.com/400/300/${encodeURIComponent(key)},food/all`
                };
            });
        }

        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if(!items || items.length === 0) {
                grid.innerHTML = `<div class="text-center text-secondary py-5">कोणतेही पदार्थ सापडले नाहीत.</div>`;
                return;
            }

            items.forEach(dish => {
                const badge = dish.type === 'veg' ? '<span class="badge-veg-dot"></span>' : '<span class="badge-nonveg-dot"></span>';
                const bestsellerBadge = dish.isBestseller ? `<span class="bestseller-badge">🔥 Bestseller</span>` : '';
                
                let portionHTML = dish.halfPrice ? 
                    `<div class="btn-group btn-group-sm w-100 my-2">
                        <input type="radio" class="btn-check" name="portion-${dish.id}" id="half-${dish.id}" value="half" checked>
                        <label class="btn btn-outline-warning py-1" for="half-${dish.id}">Half ₹${dish.halfPrice}</label>
                        <input type="radio" class="btn-check" name="portion-${dish.id}" id="full-${dish.id}" value="full">
                        <label class="btn btn-outline-warning py-1" for="full-${dish.id}">Full ₹${dish.fullPrice}</label>
                    </div>` : 
                    `<div class="text-warning fw-bold my-2">Full: ₹${dish.fullPrice}</div>`;

                grid.innerHTML += `
                    <div class="col-md-4 col-sm-6 col-12">
                        <div class="dish-card position-relative">
                            ${bestsellerBadge}
                            <img src="${dish.image}" class="dish-img" alt="${dish.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'">
                            <div class="p-3">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    ${badge}
                                    <h6 class="fw-bold text-white m-0 text-truncate">${dish.name}</h6>
                                </div>
                                ${portionHTML}
                                <button class="btn btn-warning w-100 fw-bold rounded-3 mt-2" onclick="addToCart(${dish.id})">
                                    <i class="fa-solid fa-plus me-1"></i> Add Item
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            applyFilters();
        }

        function typeFilter(type) {
            currentType = type;
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = dishes;

            if (currentCategory !== 'all') filtered = filtered.filter(d => d.category === currentCategory);
            if (currentType !== 'all') filtered = filtered.filter(d => d.type === currentType);
            if (query !== '') filtered = filtered.filter(d => d.name.toLowerCase().includes(query));

            renderMenu(filtered);
        }

        function addToCart(id) {
            const dish = dishes.find(d => d.id === id);
            let portion = 'full';
            let price = dish.fullPrice;

            const halfRadio = document.getElementById(`half-${id}`);
            if (halfRadio && halfRadio.checked) {
                portion = 'half';
                price = dish.halfPrice;
            }

            const cartKey = `${id}-${portion}`;

            if (cartMap[cartKey]) {
                cartMap[cartKey].qty += 1;
            } else {
                cartMap[cartKey] = { dish: dish, portion: portion, price: price, qty: 1 };
            }
            updateCartUI();
        }

        function changeQty(cartKey, delta) {
            if (cartMap[cartKey]) {
                cartMap[cartKey].qty += delta;
                if (cartMap[cartKey].qty <= 0) delete cartMap[cartKey];
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';

            let totalItems = 0;
            let totalPrice = 0;
            const keys = Object.keys(cartMap);

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center text-secondary py-5">तुमच्या कार्टमध्ये कोणतेही पदार्थ नाहीत.</div>`;
                document.getElementById('viewCartBtn').disabled = true;
            } else {
                document.getElementById('viewCartBtn').disabled = false;
                
                keys.forEach(key => {
                    const item = cartMap[key];
                    const itemTotal = item.price * item.qty;
                    totalItems += item.qty;
                    totalPrice += itemTotal;

                    container.innerHTML += `
                        <div class="cart-item-card d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-white m-0 fw-bold">${item.dish.name}</h6>
                                <span class="text-secondary small">(${item.portion.toUpperCase()}) - ₹${item.price}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-sm btn-outline-warning py-0 px-2" onclick="changeQty('${key}', -1)">-</button>
                                <span class="fw-bold text-warning">${item.qty}</span>
                                <button class="btn btn-sm btn-outline-warning py-0 px-2" onclick="changeQty('${key}', 1)">+</button>
                            </div>
                        </div>`;
                });
            }

            document.getElementById('cartCount').innerText = `${totalItems} Items`;
            document.getElementById('cartTotal').innerText = totalPrice;
            document.getElementById('drawerTotal').innerText = totalPrice;
        }

        function submitOrder() {
            const tableNum = document.getElementById('tableNumber').value;
            if(!tableNum) {
                alert('कृपया तुमचा टेबल नंबर प्रविष्ट करा!');
                return;
            }
            alert(`टेबल नंबर ${tableNum} ची ऑर्डर यशस्वीरीत्या सबमिट झाली आहे!`);
            cartMap = {};
            document.getElementById('tableNumber').value = '';
            updateCartUI();
            
            const bsOffcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('slideCart'));
            if(bsOffcanvas) bsOffcanvas.hide();
        }

        async function loadMenuItems() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                
                let rawList = [];
                if (Array.isArray(data)) rawList = data;
                else if (data.menu && Array.isArray(data.menu)) rawList = data.menu;

                if (rawList.length > 0) dishes = processMenuData(rawList);
                else dishes = processMenuData(defaultMenuItems);
            } catch (error) {
                dishes = processMenuData(defaultMenuItems);
            }
            renderMenu(dishes);
        }

        window.onload = loadMenuItems;
    </script>
</body>
</html>
