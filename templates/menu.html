<!DOCTYPE html>

    <style>
        :root {
            --gold-primary: #f59e0b;
            --gold-light: #fbbf24;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
        }

        body { 
            background-color: var(--bg-dark);
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding-bottom: 120px; 
            min-height: 100vh;
        }

        /* Classic Menu Header */
        .hero-section { 
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            backdrop-filter: blur(12px);
            padding: 24px 0 16px 0; 
            border-bottom: 2px solid rgba(245, 158, 11, 0.3); 
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            color: var(--gold-primary);
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
        }

        /* Category Scroll */
        .category-scroll { scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .btn-filter {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 30px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .btn-filter:hover, .btn-filter.active {
            background: var(--gold-primary);
            color: #0f172a;
            border-color: var(--gold-primary);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .search-box {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 30px !important;
            padding: 12px 22px !important;
        }

        /* Premium Menu Card Style (Text Based) */
        .menu-card { 
            background: var(--card-bg); 
            border: 1px solid rgba(245, 158, 11, 0.15); 
            border-radius: 16px; 
            padding: 20px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-primary);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .dish-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .dotted-line {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(255, 255, 255, 0.2);
            margin: 0 10px;
            position: relative;
            top: -4px;
        }

        .price-tag {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold-primary);
        }

        /* Veg / Non-Veg Indicator Dots */
        .badge-veg-dot, .badge-nonveg-dot {
            width: 18px; height: 18px; border-radius: 4px;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .badge-veg-dot { border: 2px solid #22c55e; }
        .badge-veg-dot::after { content: ''; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
        .badge-nonveg-dot { border: 2px solid #ef4444; }
        .badge-nonveg-dot::after {
            content: ''; width: 0; height: 0;
            border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-bottom: 8px solid #ef4444;
        }

        .bestseller-tag {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-btn {
            background: rgba(245, 158, 11, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            font-weight: 600;
            border-radius: 8px;
            padding: 6px 12px;
            transition: all 0.2s ease;
        }
        .custom-btn:hover {
            background: var(--gold-primary);
            color: #0f172a;
        }

        /* Modal Customization */
        .modal-content-custom {
            background: #1e293b;
            border: 1px solid var(--gold-primary);
            color: #fff;
            border-radius: 20px;
        }

        /* Cart Footer */
        .cart-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(245, 158, 11, 0.3); 
            padding: 16px 24px; z-index: 1000; 
        }

        .offcanvas-custom {
            background: #0f172a;
            color: #fff;
            border-left: 1px solid rgba(245, 158, 11, 0.3);
        }
        .cart-item-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>

        </div>

        <!-- Veg/Non-Veg Quick Filter Buttons -->
        <div class="d-flex justify-content-center gap-2 mb-3">
            <button class="btn btn-sm btn-outline-success rounded-pill px-3" onclick="typeFilter('veg')">🟢 Veg</button>
            <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="typeFilter('nonveg')">🔴 Non-Veg</button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="typeFilter('all')">Show All</button>
        </div>

        <!-- Category Filters -->
        <div class="d-flex gap-2 mb-4 overflow-auto pb-2 category-scroll justify-content-start justify-content-md-center">
            <button class="btn btn-filter active" onclick="filterCategory('all', this)">All Items</button>
            <button class="btn btn-filter" onclick="filterCategory('Starters', this)">🍢 Starters</button>
            <button class="btn btn-filter" onclick="filterCategory('Main Course', this)">🥘 Main Course</button>

                    </div>

                    <!-- Spice Level Option -->
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold small">2. तिखटपणा निवडा (Spice Level):</label>
                        <div class="d-flex gap-2">
                            <input type="radio" class="btn-check" name="spiceLevel" id="spiceLow" value="Low Spicy">
                            <label class="btn btn-outline-light flex-fill btn-sm" for="spiceLow">🌶️ कमी तिखट</label>

                            <input type="radio" class="btn-check" name="spiceLevel" id="spiceMed" value="Medium Spicy" checked>
                            <label class="btn btn-outline-warning flex-fill btn-sm" for="spiceMed">🌶️🌶️ मध्यम</label>

                            <input type="radio" class="btn-check" name="spiceLevel" id="spiceHigh" value="Full Spicy">
                            <label class="btn btn-outline-danger flex-fill btn-sm" for="spiceHigh">🌶️🌶️🌶️ जास्त तिखट</label>
                        </div>
                    </div>

                    <!-- Food Type Preferences -->
                    <div class="mb-3" id="jainOptionContainer">
                        <label class="form-label text-secondary fw-bold small">3. विशेष टीप (Special Preference):</label>
                        <div class="d-flex gap-2">
                            <input type="checkbox" class="btn-check" id="jainCheck">
                            <label class="btn btn-outline-info flex-fill btn-sm" for="jainCheck">🕊️ Jain Food (कांदा/लसूण विरहित)</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-warning w-100 fw-bold rounded-pill" onclick="confirmAddToCart()">
                        कार्टमध्ये जोडा (Add to Cart)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Cart Bar -->

        <div>
            <span class="text-secondary small fw-bold">Selected Items: <strong class="text-warning" id="cartCount">0 Items</strong></span>

        </div>
        <button class="btn btn-warning fw-bold rounded-pill px-4 shadow" id="viewCartBtn" disabled data-bs-toggle="offcanvas" data-bs-target="#slideCart">
            View Cart & Order <i class="fa-solid fa-cart-shopping ms-1"></i>
        </button>
    </div>

    <!-- Slide-in Cart Drawer -->
    <div class="offcanvas offcanvas-end offcanvas-custom" tabindex="-1" id="slideCart" aria-labelledby="slideCartLabel">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title text-warning fw-bold" id="slideCartLabel">
                <i class="fa-solid fa-basket-shopping me-2"></i>Your Order
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <div id="cartItemsContainer" class="overflow-auto pe-1">

            </div>

            <div class="border-top border-secondary pt-3 mt-3">

        let dishes = [];
        let cartMap = {};
        let currentCategory = 'all';
        let currentType = 'all';
        let selectedDishForModal = null;

        function processMenuData(rawMenu) {
            const nonVegKeywords = ['chicken', 'mutton', 'fish', 'prawn', 'egg'];
            const bestsellerList = ['Paneer Butter Masala', 'Butter Chicken', 'Chicken Dum Biryani', 'Dal Tadka', 'Sizzling Brownie with Ice Cream'];

            return rawMenu.map(item => {
                const isNonVeg = nonVegKeywords.some(kw => item.name.toLowerCase().includes(kw));
                
                return {
                    id: item.id,
                    name: item.name,
                    category: item.category || 'General',
                    type: isNonVeg ? 'nonveg' : 'veg',
                    isBestseller: bestsellerList.includes(item.name),
                    halfPrice: item.half_price > 0 ? item.half_price : null,
                    fullPrice: item.full_price
                };
            });
        }

        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if(!items || items.length === 0) {
                grid.innerHTML = `<div class="text-center text-secondary py-5">कोणतेही पदार्थ सापडले नाहीत.</div>`;
                return;
            }

            items.forEach(dish => {
                const badge = dish.type === 'veg' ? '<span class="badge-veg-dot"></span>' : '<span class="badge-nonveg-dot"></span>';
                const bestsellerBadge = dish.isBestseller ? `<span class="bestseller-tag ms-2">Bestseller</span>` : '';
                
                const displayPrice = dish.halfPrice ? `₹${dish.halfPrice} / ₹${dish.fullPrice}` : `₹${dish.fullPrice}`;

                grid.innerHTML += `
                    <div class="col-md-6 col-12">
                        <div class="menu-card" onclick="openCustomModal(${dish.id})">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    ${badge}
                                    <h6 class="dish-title">${dish.name}</h6>
                                    ${bestsellerBadge}
                                </div>
                                <div class="dotted-line d-none d-sm-block"></div>
                                <div class="price-tag">${displayPrice}</div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="text-secondary small"><i class="fa-solid fa-sliders me-1"></i>Customize & Add</span>
                                <button class="btn btn-sm custom-btn">
                                    + Add
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // 🎛️ Modal Popup Opener
        function openCustomModal(id) {
            selectedDishForModal = dishes.find(d => d.id === id);
            document.getElementById('modalDishTitle').innerText = selectedDishForModal.name;

            const portionContainer = document.getElementById('portionOptions');
            portionContainer.innerHTML = '';

            if (selectedDishForModal.halfPrice) {
                portionContainer.innerHTML = `
                    <input type="radio" class="btn-check" name="modalPortion" id="p_half" value="half" checked>
                    <label class="btn btn-outline-warning flex-fill" for="p_half">Half (₹${selectedDishForModal.halfPrice})</label>
                    
                    <input type="radio" class="btn-check" name="modalPortion" id="p_full" value="full">
                    <label class="btn btn-outline-warning flex-fill" for="p_full">Full (₹${selectedDishForModal.fullPrice})</label>
                `;
            } else {
                portionContainer.innerHTML = `
                    <input type="radio" class="btn-check" name="modalPortion" id="p_full" value="full" checked>
                    <label class="btn btn-outline-warning flex-fill" for="p_full">Full (₹${selectedDishForModal.fullPrice})</label>
                `;
            }

            // Hide Jain Option for Non-Veg
            const jainBox = document.getElementById('jainOptionContainer');
            if(selectedDishForModal.type === 'nonveg') {
                jainBox.style.display = 'none';
            } else {
                jainBox.style.display = 'block';
            }

            const modal = new bootstrap.Modal(document.getElementById('customModal'));
            modal.show();
        }

        function confirmAddToCart() {
            if(!selectedDishForModal) return;

            const portion = document.querySelector('input[name="modalPortion"]:checked').value;
            const spice = document.querySelector('input[name="spiceLevel"]:checked').value;
            const isJain = document.getElementById('jainCheck').checked && selectedDishForModal.type === 'veg';

            const price = (portion === 'half') ? selectedDishForModal.halfPrice : selectedDishForModal.fullPrice;
            
            // Build key with options
            let customNote = spice;
            if(isJain) customNote += " | Jain";

            const cartKey = `${selectedDishForModal.id}-${portion}-${customNote}`;

            if (cartMap[cartKey]) {
                cartMap[cartKey].qty += 1;
            } else {
                cartMap[cartKey] = { 
                    dish: selectedDishForModal, 
                    portion: portion, 
                    note: customNote,
                    price: price, 
                    qty: 1 
                };
            }

            // Close Modal & Update UI
            const modalEl = document.getElementById('customModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            updateCartUI();
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            applyFilters();
        }

        function typeFilter(type) {
            currentType = type;
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = dishes;

            if (currentCategory !== 'all') filtered = filtered.filter(d => d.category === currentCategory);
            if (currentType !== 'all') filtered = filtered.filter(d => d.type === currentType);
            if (query !== '') filtered = filtered.filter(d => d.name.toLowerCase().includes(query));

            renderMenu(filtered);
        }

        function changeQty(cartKey, delta) {
            if (cartMap[cartKey]) {
                cartMap[cartKey].qty += delta;
                if (cartMap[cartKey].qty <= 0) delete cartMap[cartKey];
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';

            let totalItems = 0;
            let totalPrice = 0;
            const keys = Object.keys(cartMap);

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center text-secondary py-5">तुमच्या कार्टमध्ये कोणतेही पदार्थ नाहीत.</div>`;
                document.getElementById('viewCartBtn').disabled = true;
            } else {
                document.getElementById('viewCartBtn').disabled = false;
                
                keys.forEach(key => {
                    const item = cartMap[key];
                    const itemTotal = item.price * item.qty;
                    totalItems += item.qty;
                    totalPrice += itemTotal;

                    container.innerHTML += `
                        <div class="cart-item-card d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-white m-0 fw-bold">${item.dish.name}</h6>
                                <div class="text-warning small fw-bold">(${item.portion.toUpperCase()}) - ₹${item.price}</div>
                                <div class="text-secondary extra-small" style="font-size: 11px;">${item.note}</div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-sm btn-outline-warning py-0 px-2" onclick="changeQty('${key}', -1)">-</button>
                                <span class="fw-bold text-warning">${item.qty}</span>
                                <button class="btn btn-sm btn-outline-warning py-0 px-2" onclick="changeQty('${key}', 1)">+</button>
                            </div>
                        </div>`;
                });
            }

            document.getElementById('cartCount').innerText = `${totalItems} Items`;
            document.getElementById('cartTotal').innerText = totalPrice;
            document.getElementById('drawerTotal').innerText = totalPrice;
        }

        function submitOrder() {
            const tableNum = document.getElementById('tableNumber').value;
            if(!tableNum) {
                alert('कृपया तुमचा टेबल नंबर प्रविष्ट करा!');
                return;
            }
            alert(`टेबल नंबर ${tableNum} ची ऑर्डर यशस्वीरीत्या सबमिट झाली आहे!`);
            cartMap = {};
            document.getElementById('tableNumber').value = '';
            updateCartUI();
            
            const bsOffcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('slideCart'));
            if(bsOffcanvas) bsOffcanvas.hide();
        }

        async function loadMenuItems() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                
                let rawList = [];
                if (Array.isArray(data)) rawList = data;
                else if (data.menu && Array.isArray(data.menu)) rawList = data.menu;

                if (rawList.length > 0) dishes = processMenuData(rawList);
                else dishes = processMenuData(defaultMenuItems);
            } catch (error) {
                dishes = processMenuData(defaultMenuItems);
            }
            renderMenu(dishes);
        }

        window.onload = loadMenuItems;
    </script>
</body>
</html>
