<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - The Royal Spice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .menu-card { transition: transform 0.2s; }
        .menu-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🍽️ Hotel Menu</h2>
            <a href="/" class="btn btn-outline-dark">Home</a>
        </div>

        <div class="row">
            <!-- Menu Items List -->
            <div class="col-md-8">
                <div class="row">
                    <!-- Item 1 -->
                    <div class="col-md-6 mb-3">
                        <div class="card p-3 shadow-sm menu-card">
                            <h5>Paneer Butter Masala</h5>
                            <p class="text-muted">₹ 240</p>
                            <div class="mb-2">
                                <label class="form-label small">Taste Choice:</label>
                                <select id="taste-Paneer Butter Masala" class="form-select form-select-sm">
                                    <option value="Medium">Medium 🌶️</option>
                                    <option value="Spicy">Spicy 🔥</option>
                                    <option value="Jain / Less Spicy">Jain / Less Spicy 😇</option>
                                </select>
                            </div>
                            <button class="btn btn-success btn-sm mt-2" onclick="addToCart('Paneer Butter Masala', 240)">+ Add to Order</button>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="col-md-6 mb-3">
                        <div class="card p-3 shadow-sm menu-card">
                            <h5>Veg Kolhapuri</h5>
                            <p class="text-muted">₹ 210</p>
                            <div class="mb-2">
                                <label class="form-label small">Taste Choice:</label>
                                <select id="taste-Veg Kolhapuri" class="form-select form-select-sm">
                                    <option value="Spicy">Spicy 🔥</option>
                                    <option value="Medium">Medium 🌶️</option>
                                    <option value="Extra Spicy">Extra Spicy 🌶️🔥</option>
                                </select>
                            </div>
                            <button class="btn btn-success btn-sm mt-2" onclick="addToCart('Veg Kolhapuri', 210)">+ Add to Order</button>
                        </div>
                    </div>

                    <!-- Item 3 -->
                    <div class="col-md-6 mb-3">
                        <div class="card p-3 shadow-sm menu-card">
                            <h5>Butter Garlic Roti</h5>
                            <p class="text-muted">₹ 40</p>
                            <div class="mb-2">
                                <label class="form-label small">Choice:</label>
                                <select id="taste-Butter Garlic Roti" class="form-select form-select-sm">
                                    <option value="Butter">Butter 🧈</option>
                                    <option value="Plain">Plain 🫓</option>
                                </select>
                            </div>
                            <button class="btn btn-success btn-sm mt-2" onclick="addToCart('Butter Garlic Roti', 40)">+ Add to Order</button>
                        </div>
                    </div>

                    <!-- Item 4 -->
                    <div class="col-md-6 mb-3">
                        <div class="card p-3 shadow-sm menu-card">
                            <h5>Jeera Rice</h5>
                            <p class="text-muted">₹ 140</p>
                            <div class="mb-2">
                                <label class="form-label small">Choice:</label>
                                <select id="taste-Jeera Rice" class="form-select form-select-sm">
                                    <option value="Full">Full Portion</option>
                                    <option value="Half">Half Portion</option>
                                </select>
                            </div>
                            <button class="btn btn-success btn-sm mt-2" onclick="addToCart('Jeera Rice', 140)">+ Add to Order</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cart Section -->
            <div class="col-md-4">
                <div class="card p-3 shadow">
                    <h4 class="border-bottom pb-2">🛒 Your Cart</h4>
                    <div id="cartItems" class="my-3">
                        <p class="text-muted">Your cart is empty.</p>
                    </div>
                    <h5>Total: ₹ <span id="cartTotal">0</span></h5>
                    <button class="btn btn-primary w-100 mt-3" onclick="placeOrder()">Place Order 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Code (Script Tag च्या आत) -->
    <script>
        let cart = [];

        function addToCart(itemName, price) {
            const tasteElement = document.getElementById(`taste-${itemName}`);
            const taste = tasteElement ? tasteElement.value : 'Medium';
            
            const existingIndex = cart.findIndex(item => item.name === itemName && item.taste === taste);
            
            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({ name: itemName, price: price, qty: 1, taste: taste });
            }
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const cartContainer = document.getElementById('cartItems');
            let total = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
                document.getElementById('cartTotal').innerText = 0;
                return;
            }

            cartContainer.innerHTML = '';

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                cartContainer.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center mb-2 p-2 bg-light rounded">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small class="text-primary">${item.taste}</small> | 
                            <small class="text-muted">₹${item.price} x ${item.qty}</small>
                        </div>
                        <button class="btn btn-outline-danger btn-sm" onclick="removeFromCart(${index})">🗑️ Delete</button>
                    </div>
                `;
            });

            document.getElementById('cartTotal').innerText = total;
        }

        async function placeOrder() {
            if (cart.length === 0) {
                alert("Please add items to cart first!");
                return;
            }

            const total = parseInt(document.getElementById('cartTotal').innerText);

            const response = await fetch('/api/place-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: 'Guest Customer',
                    table_no: 'Table 1',
                    items: cart,
                    total: total
                })
            });

            const result = await response.json();
            if (result.success) {
                alert("Order placed successfully! Order ID: #" + result.order_id);
                cart = [];
                renderCart();
            } else {
                alert("Failed to place order.");
            }
        }
    </script>
</body>
</html>
