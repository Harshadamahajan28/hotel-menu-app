<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Login | The Royal Spice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <h1>Customer Login</h1>
            <p>Welcome Back! Please enter your details.</p>
            <form style="display: flex; flex-direction: column; gap: 10px;">
                <input type="email" placeholder="Enter Email" required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                <input type="password" placeholder="Enter Password" required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Login</button>
            </form>
            <br>
            <a href="{{ url_for('home') }}" style="color: #f39c12; text-decoration: none;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
