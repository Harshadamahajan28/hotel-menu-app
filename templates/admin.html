<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Admin - Royal Spice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #fff; }
        .card-order { background-color: #1e1e1e; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-warning"><i class="fas fa-utensils me-2"></i>Kitchen Dashboard</h2>
            <div>
                <a href="/analytics" class="btn btn-outline-info me-2"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="/logout" class="btn btn-outline-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <div id="ordersList" class="row g-3">
            <!-- Orders load automatically here -->
            <div class="text-center py-5 text-muted">Loading orders...</div>
        </div>
    </div>

    <script>
        function fetchOrders() {
            fetch('/api/orders')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('ordersList');
                    if (!data.orders || data.orders.length === 0) {
                        container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h4>No Orders Yet!</h4></div>';
                        return;
                    }

                    let html = '';
                    data.orders.forEach(o => {
                        let statusBadge = o.status === 'Completed' ? 'bg-success' : 'bg-warning text-dark';
                        let itemsList = (o.items || []).map(i => `<li>${i.name || i.title} x ${i.qty || 1}</li>`).join('');

                        html += `
                            <div class="col-md-4">
                                <div class="card card-order p-3">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="text-warning m-0">Order #${o.id}</h5>
                                        <span class="badge ${statusBadge}">${o.status}</span>
                                    </div>
                                    <p class="mb-1"><strong>Table:</strong> ${o.table_no} | <strong>Name:</strong> ${o.customer_name}</p>
                                    <p class="mb-2 text-muted small"><i class="far fa-clock"></i> ${o.time || ''}</p>
                                    <hr class="border-secondary my-2">
                                    <ul>${itemsList}</ul>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <h6 class="m-0 text-success">₹${o.total}</h6>
                                        ${o.status === 'Pending' ? `
                                            <button onclick="updateStatus(${o.id}, 'Completed')" class="btn btn-sm btn-success">Mark Completed</button>
                                        ` : '<span class="text-muted small">Done</span>'}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                })
                .catch(err => console.error("Error fetching orders:", err));
        }

        function updateStatus(orderId, status) {
            fetch('/api/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, status: status })
            }).then(() => fetchOrders());
        }

        // 🔄 दर ५ सेकंदांनी किचन पेज स्वयंचलित (Auto-Refresh) होईल
       fetchOrders();
       setInterval(fetchOrders, 5000);
    </script>
</body>
</html>
