<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Kitchen Orders & Menu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .order-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
        .table-dark-custom { background-color: #161b22; color: #fff; border: 1px solid #30363d; }

        /* 🖨️ बिल प्रिंटिंगसाठी खास फॉरमॅट स्टाइल */
        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt {
                position: absolute; left: 0; top: 0; width: 100%;
                color: #000 !important; background: #fff !important;
                padding: 15px; font-family: 'Courier New', Courier, monospace;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4 no-print">
        <div class="container">
            <span class="navbar-brand fw-bold text-warning"><i class="fa-solid fa-utensils"></i> Kitchen Admin Dashboard</span>
            <div>
                <a href="/analytics" class="btn btn-outline-info btn-sm fw-bold me-2"><i class="fa-solid fa-chart-line"></i> Analytics</a>
                <button onclick="fetchOrders(); fetchMenuItems();" class="btn btn-warning btn-sm fw-bold"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
        </div>
    </nav>

    <div class="container no-print mb-4">
        <!-- 📌 Section Navigation Buttons -->
        <div class="d-flex gap-2 mb-4">
            <button class="btn btn-warning fw-bold" id="btnLiveOrders" onclick="switchTab('orders')">
                <i class="fa-solid fa-list-check me-1"></i> Live Orders
            </button>
            <button class="btn btn-outline-warning fw-bold" id="btnMenuManage" onclick="switchTab('menu')">
                <i class="fa-solid fa-pen-to-square me-1"></i> Manage Menu Prices
            </button>
        </div>

        <!-- 1️⃣ Live Orders Section -->
        <div id="ordersSection">
            <h4 class="fw-bold text-warning mb-3"><i class="fa-solid fa-list-check"></i> Live Orders</h4>
            <div class="row g-3" id="ordersContainer"></div>
        </div>

        <!-- 2️⃣ Menu Price Management Section (New Feature) -->
        <div id="menuSection" style="display: none;">
            <h4 class="fw-bold text-warning mb-3"><i class="fa-solid fa-tags"></i> Update Menu Prices</h4>
            <div class="table-responsive order-card p-3">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr class="text-warning border-secondary">
                            <th>ID</th>
                            <th>Item Name</th>
                            <th>Current Price (₹)</th>
                            <th>New Price (₹)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="menuItemsContainer">
                        <!-- JS द्वारे मेनू आयटम्स लोड होतील -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 🧾 प्रिंट होणारे लपवलेले बिल (Hidden Receipt) -->
    <div id="printableReceipt" style="display: none;">
        <div style="text-align: center; border-bottom: 2px dashed #000; padding-bottom: 10px; margin-bottom: 10px;">
            <h2 style="margin: 0; font-weight: bold;">THE ROYAL SPICE</h2>
            <p style="margin: 2px 0; font-size: 14px;">Delicious Food & Fine Dining</p>
            <p style="margin: 0; font-size: 12px;">Contact: +91 9876543210</p>
        </div>

        <div style="font-size: 14px; margin-bottom: 10px;">
            <div><strong>Order ID:</strong> <span id="bill_id"></span></div>
            <div><strong>Customer:</strong> <span id="bill_cust"></span></div>
            <div><strong>Table No:</strong> <span id="bill_table"></span></div>
            <div><strong>Date & Time:</strong> <span id="bill_datetime"></span></div>
        </div>

        <table style="width: 100%; text-align: left; border-top: 1px solid #000; border-bottom: 1px solid #000; font-size: 14px; margin-bottom: 10px; padding: 5px 0;">
            <thead>
                <tr>
                    <th style="padding: 5px 0;">Item Details</th>
                </tr>
            </thead>
            <tbody id="bill_items_list">
                <!-- Items Javascript द्वारे भरले जातील -->
            </tbody>
        </table>

        <div style="text-align: right; font-size: 16px; font-weight: bold; border-bottom: 2px dashed #000; padding-bottom: 10px;">
            Total Amount: ₹<span id="bill_total"></span>
        </div>

        <div style="text-align: center; margin-top: 15px; font-size: 12px;">
            *** Thank You! Visit Again ***
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allOrders = [];

        // Tab Switcher (Live Orders ⇄ Manage Prices)
        function switchTab(tab) {
            if(tab === 'orders') {
                document.getElementById('ordersSection').style.display = 'block';
                document.getElementById('menuSection').style.display = 'none';
                document.getElementById('btnLiveOrders').className = 'btn btn-warning fw-bold';
                document.getElementById('btnMenuManage').className = 'btn btn-outline-warning fw-bold';
            } else {
                document.getElementById('ordersSection').style.display = 'none';
                document.getElementById('menuSection').style.display = 'block';
                document.getElementById('btnLiveOrders').className = 'btn btn-outline-warning fw-bold';
                document.getElementById('btnMenuManage').className = 'btn btn-warning fw-bold';
                fetchMenuItems();
            }
        }

        // Live Orders Fetch करणे
        async function fetchOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                const data = await res.json();
                const container = document.getElementById('ordersContainer');
                container.innerHTML = '';

                if(data.orders.length === 0) {
                    container.innerHTML = '<div class="text-secondary text-center my-5">No orders received yet.</div>';
                    return;
                }

                allOrders = data.orders;

                data.orders.forEach(ord => {
                    const isPending = ord.status.includes('Pending');
                    const statusBadge = isPending 
                        ? `<span class="badge bg-warning text-dark">${ord.status}</span>` 
                        : `<span class="badge bg-success">${ord.status}</span>`;

                    const actionBtn = isPending 
                        ? `<button class="btn btn-success btn-sm fw-bold me-2 flex-grow-1" onclick="markCompleted(${ord.id})"><i class="fa-solid fa-check-double me-1"></i> Mark Completed</button>`
                        : `<button class="btn btn-outline-secondary btn-sm fw-bold me-2 flex-grow-1" disabled>Completed</button>`;

                    container.innerHTML += `
                        <div class="col-md-6 col-12">
                            <div class="order-card p-3 border-warning">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-warning text-dark fw-bold fs-6">Order #${ord.id}</span>
                                    ${statusBadge}
                                </div>
                                <h5 class="fw-bold text-white mb-1">Table No: ${ord.table_no}</h5>
                                <p class="text-secondary small mb-2">Customer: ${ord.customer_name} | Date: ${ord.date} (${ord.time})</p>
                                <hr class="border-secondary my-2">
                                <p class="small text-light mb-2"><strong>Items:</strong> ${ord.items_str}</p>
                                <div class="d-flex justify-content-between fw-bold text-success fs-5 border-top border-secondary pt-2 mb-3">
                                    <span>Total:</span>
                                    <span>₹${ord.total}</span>
                                </div>
                                <div class="d-flex justify-content-between">
                                    ${actionBtn}
                                    <button class="btn btn-outline-warning btn-sm fw-bold" onclick="printBill(${ord.id})">
                                        <i class="fa-solid fa-print me-1"></i> Print Bill
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { console.error('Failed to load orders'); }
        }

        // Order Complete करणे
        async function markCompleted(orderId) {
            try {
                const res = await fetch('/api/admin/complete_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });
                const data = await res.json();
                if(data.success) { fetchOrders(); }
            } catch(e) { alert('Failed to update status'); }
        }

        // ✏️ Menu Items Fetch करणे (Price Update साठी)
        async function fetchMenuItems() {
            try {
                const res = await fetch('/api/menu'); // तुमचा मेनू Get करायचा API Endpoint
                const data = await res.json();
                const tbody = document.getElementById('menuItemsContainer');
                tbody.innerHTML = '';

                if(!data.menu || data.menu.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary">No menu items found.</td></tr>';
                    return;
                }

                data.menu.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${item.id}</td>
                            <td class="fw-bold">${item.name}</td>
                            <td class="text-warning fw-bold">₹${item.price}</td>
                            <td style="width: 150px;">
                                <input type="number" id="price_input_${item.id}" class="form-control form-control-sm bg-dark text-white border-secondary" value="${item.price}">
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning fw-bold" onclick="updateItemPrice(${item.id})">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Save
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error('Failed to load menu items'); }
        }

        // 💾 Price Update API पाठवणे
        async function updateItemPrice(itemId) {
            const newPrice = document.getElementById(`price_input_${itemId}`).value;
            if(!newPrice || newPrice <= 0) {
                alert('कृपया योग्य किंमत टाका!');
                return;
            }

            try {
                const res = await fetch('/api/admin/update_item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: itemId, price: newPrice })
                });
                const data = await res.json();
                if(data.success) {
                    alert('किंमत यशस्विपणे अपडेट झाली! ✅');
                    fetchMenuItems();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch(e) { alert('Failed to update price'); }
        }

        // 🖨️ बिल प्रिंट करण्याचे फंक्शन
        function printBill(orderId) {
            const ord = allOrders.find(o => o.id === orderId);
            if(!ord) return;

            document.getElementById('bill_id').innerText = '#' + ord.id;
            document.getElementById('bill_cust').innerText = ord.customer_name;
            document.getElementById('bill_table').innerText = ord.table_no;
            document.getElementById('bill_datetime').innerText = `${ord.date} (${ord.time})`;
            document.getElementById('bill_total').innerText = ord.total;

            const itemsArr = ord.items_str.split(',');
            let itemsHTML = '';
            itemsArr.forEach(item => {
                itemsHTML += `<tr><td style="padding: 3px 0;">• ${item.trim()}</td></tr>`;
            });
            document.getElementById('bill_items_list').innerHTML = itemsHTML;

            const receiptDiv = document.getElementById('printableReceipt');
            receiptDiv.style.display = 'block';
            window.print();
            receiptDiv.style.display = 'none';
        }

        setInterval(fetchOrders, 5000);
        fetchOrders();
    </script>
</body>
</html>
