<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Kitchen Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .order-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold text-warning"><i class="fa-solid fa-utensils"></i> Kitchen Admin Dashboard</span>
            <div>
                <a href="/analytics" class="btn btn-outline-info btn-sm fw-bold me-2"><i class="fa-solid fa-chart-line"></i> Analytics</a>
                <button onclick="fetchOrders()" class="btn btn-warning btn-sm fw-bold"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h4 class="fw-bold text-warning mb-3"><i class="fa-solid fa-list-check"></i> Live Orders</h4>
        <div class="row g-3" id="ordersContainer"></div>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                const data = await res.json();
                const container = document.getElementById('ordersContainer');
                container.innerHTML = '';

                if(data.orders.length === 0) {
                    container.innerHTML = '<div class="text-secondary text-center my-5">No orders received yet.</div>';
                    return;
                }

                data.orders.forEach(ord => {
                    let itemsHTML = '';
                    ord.items.forEach(i => {
                        itemsHTML += `<li class="d-flex justify-content-between"><span>${i.name} (x${i.qty})</span><strong>₹${i.price * i.qty}</strong></li>`;
                    });

                    const isPending = ord.status.includes('Pending');
                    const statusBadge = isPending 
                        ? `<span class="badge bg-warning text-dark">${ord.status}</span>` 
                        : `<span class="badge bg-success">${ord.status}</span>`;

                    const actionBtn = isPending 
                        ? `<button class="btn btn-success btn-sm w-100 fw-bold mt-2" onclick="markCompleted('${ord.id}')"><i class="fa-solid fa-check-double me-1"></i> Mark as Completed</button>`
                        : `<button class="btn btn-outline-secondary btn-sm w-100 fw-bold mt-2" disabled>Completed</button>`;

                    container.innerHTML += `
                        <div class="col-md-6 col-12">
                            <div class="order-card p-3 border-warning">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-warning text-dark fw-bold fs-6">Order #${ord.id}</span>
                                    ${statusBadge}
                                </div>
                                <h5 class="fw-bold text-white mb-1">Table No: ${ord.table_no}</h5>
                                <p class="text-secondary small mb-2">Customer: ${ord.customer_name} | Time: ${ord.time}</p>
                                <hr class="border-secondary my-2">
                                <ul class="list-unstyled small text-light mb-2">${itemsHTML}</ul>
                                <div class="d-flex justify-content-between fw-bold text-success fs-5 border-top border-secondary pt-2 mb-2">
                                    <span>Total:</span>
                                    <span>₹${ord.total}</span>
                                </div>
                                ${actionBtn}
                            </div>
                        </div>
                    `;
                });
            } catch(e) { console.error('Failed to load orders'); }
        }

        async function markCompleted(orderId) {
            try {
                const res = await fetch('/api/admin/complete_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });
                const data = await res.json();
                if(data.success) {
                    fetchOrders(); // Refresh status immediately
                }
            } catch(e) { alert('Failed to update status'); }
        }

        setInterval(fetchOrders, 5000);
        fetchOrders();
    </script>
</body>
</html>
