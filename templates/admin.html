<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin">👑 Admin Dashboard</a>
            <div>
                <a href="/analytics" class="btn btn-outline-info btn-sm me-2">Analytics</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h3 class="fw-bold mb-3">Live Customer Orders</h3>
        <div class="table-responsive bg-white p-3 shadow-sm rounded">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Table</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="7" class="text-center">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function fetchOrders() {
            fetch('/api/orders')
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = '';
                
                if (data.orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No orders placed yet.</td></tr>';
                    return;
                }

                data.orders.forEach(order => {
                    let itemsStr = order.items.map(i => i.item_name).join(', ');
                    let badgeClass = order.status === 'Completed' ? 'bg-success' : 'bg-warning text-dark';

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${order.table_no}</strong></td>
                            <td>${order.customer_name}</td>
                            <td>${itemsStr}</td>
                            <td>₹ ${order.total}</td>
                            <td><small>${order.time}</small></td>
                            <td><span class="badge ${badgeClass}">${order.status}</span></td>
                            <td>
                                ${order.status === 'Pending' ? `<button class="btn btn-sm btn-success" onclick="updateStatus(${order.id}, 'Completed')">Complete</button>` : '—'}
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function updateStatus(orderId, newStatus) {
            fetch('/api/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, status: newStatus })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) fetchOrders();
            });
        }

        setInterval(fetchOrders, 3000);
        fetchOrders();
    </script>
</body>
</html>
