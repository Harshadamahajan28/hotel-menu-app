<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kitchen Display System (KDS)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .order-card { border-left: 6px solid #ffc107; }
        .taste-badge { background-color: #e3f2fd; color: #0d6efd; font-weight: bold; }
    </style>
</head>
<body class="bg-dark text-white p-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>👨‍🍳 Kitchen Live Orders (15 Days History)</h2>
            <button onclick="loadKitchenOrders()" class="btn btn-outline-light btn-sm">🔄 Refresh Orders</button>
        </div>

        <div class="row" id="kitchenOrdersList">
            <!-- Dynamic Kitchen Orders will be loaded here -->
        </div>
    </div>

    <script>
        async function loadKitchenOrders() {
            const response = await fetch('/api/orders');
            const orders = await response.json();
            const container = document.getElementById('kitchenOrdersList');
            container.innerHTML = '';

            orders.reverse().forEach(order => {
                let itemsList = '';
                order.items.forEach(item => {
                    itemsList += `<li><strong>${item.name}</strong> x ${item.qty} <span class="badge taste-badge">${item.taste || 'Regular'}</span></li>`;
                });

                container.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card text-dark shadow-sm order-card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <h5 class="card-title">${order.table_no} (#${order.id})</h5>
                                    <span class="badge bg-info text-dark">${order.status}</span>
                                </div>
                                <small class="text-muted">📅 ${order.created_at}</small>
                                <hr>
                                <ul>${itemsList}</ul>
                                <div class="d-flex gap-2 mt-3">
                                    <button class="btn btn-warning btn-sm" onclick="updateStatus(${order.id}, 'Cooking 👨‍🍳')">Cooking</button>
                                    <button class="btn btn-success btn-sm" onclick="updateStatus(${order.id}, 'Ready ✅')">Ready</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function updateStatus(id, status) {
            await fetch(`/api/update-status/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            });
            loadKitchenOrders();
        }

        setInterval(loadKitchenOrders, 5000); // ऑटोमॅटिक दर ५ सेकंदांनी रिफ्रेश होईल
        loadKitchenOrders();
    </script>
</body>
</html>
