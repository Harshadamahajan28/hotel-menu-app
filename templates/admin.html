<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Royal Spice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50 !important; }
        .stat-card { border-radius: 12px; padding: 25px; color: white; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .bg-revenue { background: linear-gradient(135deg, #28a745, #218838); }
        .bg-orders { background: linear-gradient(135deg, #17a2b8, #117a8b); }
        .table-container { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table thead { background-color: #34495e; color: white; }
        .badge-pending { background-color: #ffc107; color: #000; font-weight: bold; }
        .badge-completed { background-color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/admin">👨‍🍳 Admin Dashboard</a>
            <div class="ms-auto">
                <a href="/analytics" class="btn btn-outline-info btn-sm me-3 fw-bold px-3">📊 Analytics</a>
                <a href="/logout" class="btn btn-danger btn-sm fw-bold px-3 shadow">Logout 🔒</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- Live Stats -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="stat-card bg-revenue d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-2 text-white-50 fw-bold">Total Revenue</h5>
                        <h1 class="fw-bold mb-0">₹ <span id="totalRevenue">0</span></h1>
                    </div>
                    <h1 class="display-3 opacity-50 mb-0">💰</h1>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card bg-orders d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-2 text-white-50 fw-bold">Total Orders Served</h5>
                        <h1 class="fw-bold mb-0"><span id="totalOrders">0</span></h1>
                    </div>
                    <h1 class="display-3 opacity-50 mb-0">📋</h1>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="table-container border">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h4 class="fw-bold text-dark mb-0">Live Customer Orders</h4>
                <span class="text-success small fw-bold px-3 py-1 bg-success bg-opacity-10 rounded-pill">🟢 Auto-updating...</span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th class="py-3">Table No.</th>
                            <th>Customer</th>
                            <th>Ordered Items</th>
                            <th>Total Bill</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="7" class="text-center py-5 text-muted fw-bold">Loading live orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function fetchOrders() {
            fetch('/api/orders')
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = '';
                
                if(data.stats) {
                    document.getElementById('totalRevenue').innerText = data.stats.total_revenue;
                    document.getElementById('totalOrders').innerText = data.stats.total_orders;
                }

                if (!data.orders || data.orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted fw-bold">No active orders right now.</td></tr>';
                    return;
                }

                data.orders.forEach(order => {
                    let itemsStr = order.items.map(i => i.item_name).join(', ');
                    let isPending = order.status === 'Pending';
                    let badgeClass = isPending ? 'badge-pending' : 'badge-completed';

                    tbody.innerHTML += `
                        <tr>
                            <td class="py-3"><span class="fs-5 fw-bold text-primary">${order.table_no}</span></td>
                            <td><span class="fw-bold text-dark">${order.customer_name}</span></td>
                            <td><span class="text-secondary fw-medium">${itemsStr}</span></td>
                            <td><span class="fw-bold text-success fs-6">₹ ${order.total}</span></td>
                            <td><small class="text-muted fw-bold">${order.time}</small></td>
                            <td><span class="badge ${badgeClass} px-3 py-2 rounded-pill shadow-sm">${order.status}</span></td>
                            <td>
                                ${isPending ? `<button class="btn btn-sm btn-success fw-bold px-3 shadow-sm" onclick="updateStatus(${order.id}, 'Completed')">Mark Done ✔</button>` : '<span class="text-muted fw-bold">Delivered 🎉</span>'}
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function updateStatus(orderId, newStatus) {
            fetch('/api/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, status: newStatus })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) fetchOrders();
            });
        }

        // Fetch every 3 seconds for live updates
        setInterval(fetchOrders, 3000);
        fetchOrders();
    </script>
</body>
</html>
