<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Spice Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4'); background-size: cover; color: white; padding: 60px 0; text-align: center; }
        .card { border-radius: 12px; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">👑 Royal Spice</a>
            <div class="ms-auto">
                <a href="#menu-section" class="btn btn-outline-warning me-2">📜 Menu</a>
                <a href="/login" class="btn btn-warning">Admin Login</a>
            </div>
        </div>
    </nav>

    <!-- Hero Header -->
    <div class="hero-section">
        <h1>Welcome to Royal Spice</h1>
        <p>Delicious Food, Right at Your Table!</p>
        <a href="#menu-section" class="btn btn-warning btn-lg mt-3">View Menu & Order</a>
    </div>

    <!-- Main Content Area -->
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <label for="tableName" class="form-label fw-bold">Select Table Number:</label>
                <select id="tableName" class="form-select form-select-lg">
                    <option value="Table 1">Table 1</option>
                    <option value="Table 2">Table 2</option>
                    <option value="Table 3">Table 3</option>
                    <option value="Table 4">Table 4</option>
                    <option value="Table 5">Table 5</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="custName" class="form-label fw-bold">Your Name:</label>
                <input type="text" id="custName" class="form-control form-control-lg" placeholder="Enter your name">
            </div>
        </div>

        <!-- Menu Section -->
        <h2 id="menu-section" class="fw-bold mb-4 border-bottom pb-2">Our Delicious Menu</h2>
        <div class="row g-4" id="menuItems">
            <!-- Items loaded via JS -->
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Paneer Butter Masala</h5>
                    <p class="text-muted">₹ 220</p>
                    <button class="btn btn-primary" onclick="addToCart('Paneer Butter Masala', 220)">Add to Order</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Butter Roti</h5>
                    <p class="text-muted">₹ 25</p>
                    <button class="btn btn-primary" onclick="addToCart('Butter Roti', 25)">Add to Order</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Veg Biryani</h5>
                    <p class="text-muted">₹ 180</p>
                    <button class="btn btn-primary" onclick="addToCart('Veg Biryani', 180)">Add to Order</button>
                </div>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="card mt-5 p-4 shadow">
            <h4 class="fw-bold">Your Cart Order</h4>
            <ul id="cartList" class="list-group list-group-flush my-3">
                <li class="list-group-item text-muted">No items added yet.</li>
            </ul>
            <div class="d-flex justify-content-between align-items-center">
                <h5>Total: ₹ <span id="cartTotal">0</span></h5>
                <button class="btn btn-success btn-lg" onclick="placeOrder()">Submit Order 🚀</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ item_name: name, price: price });
            updateCartUI();
        }

        function updateCartUI() {
            let list = document.getElementById('cartList');
            let totalSpan = document.getElementById('cartTotal');
            list.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">No items added yet.</li>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        ${item.item_name} - ₹${item.price}
                        <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">X</button>
                    </li>`;
                });
            }
            totalSpan.innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function placeOrder() {
            let tableNo = document.getElementById('tableName').value;
            let custName = document.getElementById('custName').value || 'Guest';

            if (cart.length === 0) {
                alert("Please add at least one item to order!");
                return;
            }

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    table_no: tableNo,
                    customer_name: custName,
                    items: cart,
                    total: parseInt(document.getElementById('cartTotal').innerText)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("Order Placed Successfully!");
                    cart = [];
                    updateCartUI();
                } else {
                    alert("Error placing order.");
                }
            });
        }
    </script>
</body>
</html>
