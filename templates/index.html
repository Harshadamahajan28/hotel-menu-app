<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | The Royal Spice Restaurant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .hero-card {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .btn-custom-menu {
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-custom-menu:hover { background-color: #e0a800; }
        .btn-custom-pay {
            background-color: #28a745;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-custom-pay:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-12">
                <div class="hero-card shadow-lg">
                    <h1 class="display-4 fw-bold text-warning mb-2"><i class="fa-solid fa-utensils me-2"></i>THE ROYAL SPICE</h1>
                    <p class="lead text-light mb-4">Delicious Food & Premium Dining Experience</p>
                    
                    <hr class="border-secondary mb-4">

                    <!-- आधीचे ऑप्शन्स आणि नवीन Quick Pay बटण -->
                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mb-3">
                        <a href="/menu" class="btn btn-custom-menu btn-lg px-4 gap-3"><i class="fa-solid fa-book-open me-2"></i> View Menu & Order</a>
                        <button class="btn btn-custom-pay btn-lg px-4" data-bs-toggle="modal" data-bs-target="#payModal"><i class="fa-solid fa-qrcode me-2"></i> Quick Pay / Direct UPI</button>
                    </div>

                    <div class="mt-4 pt-3 border-top border-secondary">
                        <a href="/admin" class="text-secondary text-decoration-none me-3 small"><i class="fa-solid fa-user-gear me-1"></i> Kitchen Admin</a>
                        <a href="/analytics" class="text-secondary text-decoration-none small"><i class="fa-solid fa-chart-line me-1"></i> Sales Analytics</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 💳 Direct Payment Popup Modal -->
    <div class="modal fade" id="payModal" tabindex="-1" aria-labelledby="payModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-warning">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-warning" id="payModalLabel"><i class="fa-solid fa-wallet me-2"></i> Direct UPI Payment</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-secondary small">Enter amount and table number to generate GPay / PhonePe QR Code.</p>
                    
                    <div class="mb-3 text-start">
                        <label class="form-label text-warning small fw-bold">Table No / Parcel Name:</label>
                        <input type="text" id="payTable" class="form-control bg-secondary text-white border-0" placeholder="e.g. Table 4 / Parcel">
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label text-warning small fw-bold">Amount (₹):</label>
                        <input type="number" id="payAmount" class="form-control bg-secondary text-white border-0" placeholder="e.g. 250" oninput="generateQR()">
                    </div>

                    <!-- Dynamic QR Display -->
                    <div id="qrArea" class="my-3 p-3 bg-white rounded text-dark d-none">
                        <h6 class="fw-bold mb-2">Scan & Pay via any UPI App</h6>
                        <img id="qrImage" src="" alt="UPI QR Code" class="img-fluid mb-2" style="max-width: 200px;">
                        <p class="mb-0 text-muted small fw-bold">UPI ID: hotel@upi</p>
                    </div>
                </div>
                <div class="modal-footer border-secondary justify-content-between">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success btn-sm fw-bold" onclick="confirmPayment()">Done / Paid ✅</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 🛠️ डमी UPI ID
        const dummyUPI = "hotel@upi"; 
        const hotelName = "The Royal Spice";

        function generateQR() {
            const amount = document.getElementById('payAmount').value;
            const qrArea = document.getElementById('qrArea');
            const qrImage = document.getElementById('qrImage');

            if(amount && amount > 0) {
                // Dynamic QR API
                const upiString = `upi://pay?pa=${dummyUPI}&pn=${encodeURIComponent(hotelName)}&am=${amount}&cu=INR`;
                qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
                qrArea.classList.remove('d-none');
            } else {
                qrArea.classList.add('d-none');
            }
        }

        function confirmPayment() {
            const table = document.getElementById('payTable').value;
            const amount = document.getElementById('payAmount').value;

            if(!table || !amount) {
                alert('Please enter Table No and Amount!');
                return;
            }

            alert(`Thank you! Payment request of ₹${amount} for ${table} processed successfully.`);
            location.reload();
        }
    </script>
</body>
</html>
