<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Spice Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">👑 Royal Spice Menu</a>
            <a href="/login" class="btn btn-outline-light btn-sm">Admin Login</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">Select Table Number:</label>
                <select id="tableName" class="form-select">
                    <option value="Table 1">Table 1</option>
                    <option value="Table 2">Table 2</option>
                    <option value="Table 3">Table 3</option>
                    <option value="Table 4">Table 4</option>
                    <option value="Table 5">Table 5</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Your Name:</label>
                <input type="text" id="custName" class="form-control" placeholder="Enter name">
            </div>
        </div>

        <h3 class="fw-bold mb-3">Menu Items</h3>
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Paneer Butter Masala</h5>
                    <p class="text-muted mb-2">₹ 220</p>
                    <button class="btn btn-primary btn-sm" onclick="addToCart('Paneer Butter Masala', 220)">Add</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Butter Roti</h5>
                    <p class="text-muted mb-2">₹ 25</p>
                    <button class="btn btn-primary btn-sm" onclick="addToCart('Butter Roti', 25)">Add</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Veg Biryani</h5>
                    <p class="text-muted mb-2">₹ 180</p>
                    <button class="btn btn-primary btn-sm" onclick="addToCart('Veg Biryani', 180)">Add</button>
                </div>
            </div>
        </div>

        <div class="card my-4 p-3 shadow-sm">
            <h4 class="fw-bold">Cart</h4>
            <ul id="cartList" class="list-group list-group-flush my-2">
                <li class="list-group-item text-muted">No items added.</li>
            </ul>
            <div class="d-flex justify-content-between align-items-center">
                <h5>Total: ₹ <span id="cartTotal">0</span></h5>
                <button class="btn btn-success" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ item_name: name, price: price });
            updateCartUI();
        }

        function updateCartUI() {
            let list = document.getElementById('cartList');
            let totalSpan = document.getElementById('cartTotal');
            list.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">No items added.</li>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        ${item.item_name} - ₹${item.price}
                        <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">X</button>
                    </li>`;
                });
            }
            totalSpan.innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function placeOrder() {
            let tableNo = document.getElementById('tableName').value;
            let custName = document.getElementById('custName').value || 'Guest';

            if (cart.length === 0) {
                alert("Please add at least one item!");
                return;
            }

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    table_no: tableNo,
                    customer_name: custName,
                    items: cart,
                    total: parseInt(document.getElementById('cartTotal').innerText)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("Order Placed Successfully!");
                    cart = [];
                    updateCartUI();
                } else {
                    alert("Error placing order.");
                }
            });
        }
    </script>
</body>
</html>
