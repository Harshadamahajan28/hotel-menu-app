<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date-wise Analytics | The Royal Spice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
        .order-table-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold text-info"><i class="fa-solid fa-chart-line me-2"></i> Date-wise Sales Analytics</span>
            <a href="/admin" class="btn btn-outline-warning btn-sm fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Admin Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <!-- 📅 Date Picker Filter Section -->
        <div class="card bg-dark border-secondary p-3 mb-4">
            <div class="row align-items-center g-3">
                <div class="col-md-4 col-12">
                    <label class="form-label text-warning fw-bold mb-1"><i class="fa-solid fa-calendar-days me-1"></i> Select Date to View Report:</label>
                    <input type="date" id="filterDate" class="form-control bg-secondary text-white border-0" onchange="loadAnalytics()">
                </div>
                <div class="col-md-8 col-12 d-flex align-items-end gap-2">
                    <button class="btn btn-info fw-bold" onclick="loadAnalytics()"><i class="fa-solid fa-filter me-1"></i> Filter Data</button>
                    <button class="btn btn-outline-secondary fw-bold text-white" onclick="resetDate()"><i class="fa-solid fa-rotate me-1"></i> Show Today</button>
                </div>
            </div>
        </div>

        <!-- 📊 Stat Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-warning mb-1"><i class="fa-solid fa-receipt"></i></div>
                    <h3 class="fw-bold m-0" id="totalOrders">0</h3>
                    <p class="text-secondary small mb-0">Total Orders</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-success mb-1"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                    <h3 class="fw-bold text-success m-0">₹<span id="totalRevenue">0</span></h3>
                    <p class="text-secondary small mb-0">Total Revenue</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-warning mb-1"><i class="fa-solid fa-clock"></i></div>
                    <h3 class="fw-bold text-warning m-0" id="pendingOrders">0</h3>
                    <p class="text-secondary small mb-0">Pending Orders</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-info mb-1"><i class="fa-solid fa-circle-check"></i></div>
                    <h3 class="fw-bold text-info m-0" id="completedOrders">0</h3>
                    <p class="text-secondary small mb-0">Completed Orders</p>
                </div>
            </div>
        </div>

        <!-- 📑 Order History Table -->
        <div class="order-table-card">
            <h5 class="fw-bold text-warning mb-3"><i class="fa-solid fa-list"></i> Order Details for Selected Date</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr class="text-secondary">
                            <th>Order ID</th>
                            <th>Table No</th>
                            <th>Customer Name</th>
                            <th>Items</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTableBody">
                        <tr><td colspan="7" class="text-center text-secondary py-4">Select a date to view orders</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // आजची तारीख बाय-डिफॉल्ट सेट करणे (YYYY-MM-DD)
        document.getElementById('filterDate').valueAsDate = new Date();

        async function loadAnalytics() {
            const selectedDate = document.getElementById('filterDate').value;
            
            try {
                const res = await fetch(`/api/admin/analytics_data?date=${selectedDate}`);
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('totalOrders').innerText = data.total_orders;
                    document.getElementById('totalRevenue').innerText = data.total_revenue;
                    document.getElementById('pendingOrders').innerText = data.pending_orders;
                    document.getElementById('completedOrders').innerText = data.completed_orders;

                    const tableBody = document.getElementById('analyticsTableBody');
                    tableBody.innerHTML = '';

                    if(data.orders.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-secondary py-4">No orders found for ${selectedDate}</td></tr>`;
                        return;
                    }

                    data.orders.forEach(ord => {
                        const statusBadge = ord.status.includes('Pending') 
                            ? `<span class="badge bg-warning text-dark">${ord.status}</span>`
                            : `<span class="badge bg-success">${ord.status}</span>`;

                        let itemDetails = ord.items.map(i => `${i.name} (x${i.qty})`).join(', ');

                        tableBody.innerHTML += `
                            <tr>
                                <td><strong class="text-warning">#${ord.id}</strong></td>
                                <td>Table ${ord.table_no}</td>
                                <td>${ord.customer_name}</td>
                                <td class="small text-light">${itemDetails}</td>
                                <td class="text-success fw-bold">₹${ord.total}</td>
                                <td>${statusBadge}</td>
                                <td class="text-secondary small">${ord.time}</td>
                            </tr>
                        `;
                    });
                }
            } catch(e) {
                console.error('Error loading analytics:', e);
            }
        }

        function resetDate() {
            document.getElementById('filterDate').valueAsDate = new Date();
            loadAnalytics();
        }

        // पेज लोड झाल्यावर आजचा डेटा दाखवा
        loadAnalytics();
    </script>
</body>
</html>
