<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - The Royal Spice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .stat-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <h2 class="fw-bold text-warning"><i class="fa-solid fa-chart-line"></i> Sales & Revenue Analytics</h2>
            <div>
                <a href="/admin" class="btn btn-outline-warning btn-sm me-2"><i class="fa-solid fa-utensils"></i> Kitchen Admin</a>
                <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house"></i> Home</a>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card stat-card p-3 text-white">
                    <small class="text-muted fw-bold">TOTAL REVENUE</small>
                    <h3 class="text-success fw-bold mt-2">₹ <span id="totalRevenue">0</span></h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3 text-white">
                    <small class="text-muted fw-bold">TOTAL ORDERS</small>
                    <h3 class="text-warning fw-bold mt-2"><span id="totalOrders">0</span></h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3 text-white">
                    <small class="text-muted fw-bold">COMPLETED ORDERS</small>
                    <h3 class="text-info fw-bold mt-2"><span id="completedOrders">0</span></h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card p-3 text-white">
                    <small class="text-muted fw-bold">PENDING ORDERS</small>
                    <h3 class="text-danger fw-bold mt-2"><span id="pendingOrders">0</span></h3>
                </div>
            </div>
        </div>

        <!-- Recent Sales Table -->
        <div class="card stat-card p-4">
            <h5 class="fw-bold text-warning mb-3"><i class="fa-solid fa-list"></i> Order History Summary</h5>
            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle m-0">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer Name</th>
                            <th>Table</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTable">
                        <tr><td colspan="5" class="text-center py-4 text-muted">Loading analytics data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadAnalytics() {
            const res = await fetch('/api/orders');
            const data = await res.json();

            document.getElementById('totalRevenue').innerText = data.stats.total_revenue;
            document.getElementById('totalOrders').innerText = data.stats.total_orders;
            document.getElementById('completedOrders').innerText = data.stats.completed_orders;
            document.getElementById('pendingOrders').innerText = data.stats.pending_orders;

            const tbody = document.getElementById('analyticsTable');
            if (data.orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No sales data recorded yet.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.orders.forEach(order => {
                const statusBadge = order.status === 'Completed' 
                    ? '<span class="badge bg-success">Completed</span>' 
                    : '<span class="badge bg-warning text-dark">Pending</span>';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${order.id}</strong></td>
                        <td>${order.customer_name}</td>
                        <td>${order.table_no}</td>
                        <td class="text-success fw-bold">₹${order.total}</td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            });
        }

        setInterval(loadAnalytics, 5000);
        loadAnalytics();
    </script>
</body>
</html>
