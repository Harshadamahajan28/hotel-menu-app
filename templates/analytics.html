<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard | The Royal Spice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
        .order-table-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold text-info"><i class="fa-solid fa-chart-line me-2"></i> Sales & Orders Analytics</span>
            <div>
                <a href="/admin" class="btn btn-outline-warning btn-sm fw-bold me-2"><i class="fa-solid fa-arrow-left me-1"></i> Admin Dashboard</a>
                <button onclick="loadAnalytics()" class="btn btn-info btn-sm fw-bold"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 📊 आकडेवारी कार्ड्स -->
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-warning mb-1"><i class="fa-solid fa-receipt"></i></div>
                    <h3 class="fw-bold m-0" id="totalOrders">0</h3>
                    <p class="text-secondary small mb-0">Total Orders</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-success mb-1"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                    <h3 class="fw-bold text-success m-0">₹<span id="totalRevenue">0</span></h3>
                    <p class="text-secondary small mb-0">Total Revenue</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-warning mb-1"><i class="fa-solid fa-clock"></i></div>
                    <h3 class="fw-bold text-warning m-0" id="pendingOrders">0</h3>
                    <p class="text-secondary small mb-0">Pending Orders</p>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card text-center">
                    <div class="fs-2 text-info mb-1"><i class="fa-solid fa-circle-check"></i></div>
                    <h3 class="fw-bold text-info m-0" id="completedOrders">0</h3>
                    <p class="text-secondary small mb-0">Completed Orders</p>
                </div>
            </div>
        </div>

        <!-- 📑 ऑर्डर्सची संपूर्ण यादी (Order History Table) -->
        <div class="order-table-card">
            <h5 class="fw-bold text-warning mb-3"><i class="fa-solid fa-list"></i> Recent Orders History</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr class="text-secondary">
                            <th>Order ID</th>
                            <th>Table No</th>
                            <th>Customer Name</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTableBody">
                        <tr><td colspan="6" class="text-center text-secondary py-4">Loading analytics...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadAnalytics() {
            try {
                const res = await fetch('/api/admin/analytics_data');
                const data = await res.json();
                
                if(data.success) {
                    // Update Stat Numbers
                    document.getElementById('totalOrders').innerText = data.total_orders;
                    document.getElementById('totalRevenue').innerText = data.total_revenue;
                    document.getElementById('pendingOrders').innerText = data.pending_orders;
                    document.getElementById('completedOrders').innerText = data.completed_orders;

                    // Update Table
                    const tableBody = document.getElementById('analyticsTableBody');
                    tableBody.innerHTML = '';

                    if(data.orders.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">No orders placed yet.</td></tr>';
                        return;
                    }

                    data.orders.forEach(ord => {
                        const statusBadge = ord.status.includes('Pending') 
                            ? `<span class="badge bg-warning text-dark">${ord.status}</span>`
                            : `<span class="badge bg-success">${ord.status}</span>`;

                        tableBody.innerHTML += `
                            <tr>
                                <td><strong class="text-warning">#${ord.id}</strong></td>
                                <td>Table ${ord.table_no}</td>
                                <td>${ord.customer_name}</td>
                                <td class="text-success fw-bold">₹${ord.total}</td>
                                <td>${statusBadge}</td>
                                <td class="text-secondary small">${ord.time}</td>
                            </tr>
                        `;
                    });
                }
            } catch(e) {
                console.error('Error loading analytics:', e);
            }
        }

        // दर ३ सेकंदांनी अ‍ॅनालिटिक्स आपोआप रिफ्रेश होईल
        setInterval(loadAnalytics, 3000);
        loadAnalytics();
    </script>
</body>
</html>
