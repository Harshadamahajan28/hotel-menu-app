<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Order Analytics - The Royal Spice</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Chart.js for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📊 Daily Order Analytics</h2>
            <a href="/admin" class="btn btn-outline-secondary">Back to Admin</a>
        </div>

        <!-- Metric Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3 shadow">
                    <div class="card-body">
                        <h5 class="card-title">Total Sales Today</h5>
                        <p class="card-text display-6">₹ {{ sales }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3 shadow">
                    <div class="card-body">
                        <h5 class="card-title">Total Orders</h5>
                        <p class="card-text display-6">{{ orders }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3 shadow">
                    <div class="card-body">
                        <h5 class="card-title">Most Popular Dish</h5>
                        <p class="card-text display-6 fw-bold" style="font-size: 1.5rem;">{{ top_item }}</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sales Graph Card -->
        <div class="card shadow p-4">
            <h4 class="mb-3">Sales Overview (Hourly)</h4>
            <canvas id="salesChart" width="400" height="150"></canvas>
        </div>
    </div>

    <!-- Chart.js Script (इथे रिअल-टाईम डेटा जोडला आहे) -->
    <script>
        const ctx = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['12 PM', '2 PM', '4 PM', '6 PM', '8 PM', '10 PM'],
                datasets: [{
                    label: 'Sales (in ₹)',
                    data: {{ chart_data | tojson }}, // app.py मधील डेटा इथे आपोआप लोड होईल
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
