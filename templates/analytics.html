<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Order Analytics - The Royal Spice</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Chart.js for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📈 Daily Order Analytics</h2>
            <a href="/admin" class="btn btn-outline-secondary">← Back to Admin</a>
        </div>
        
        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-success p-3 text-center shadow-sm">
                    <h5>Today's Sales</h5>
                    <h3 class="fw-bold">₹{{ sales }}</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-primary p-3 text-center shadow-sm">
                    <h5>Total Orders Today</h5>
                    <h3 class="fw-bold">{{ orders }}</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-white bg-warning p-3 text-center shadow-sm">
                    <h5>Most Popular Item</h5>
                    <h3 class="fw-bold">{{ top_item }}</h3>
                </div>
            </div>
        </div>

        <!-- Sales Chart -->
        <div class="card p-4 shadow-sm">
            <h5 class="card-title mb-3">Hourly Sales Trend (Today)</h5>
            <canvas id="salesChart" width="400" height="150"></canvas>
        </div>
    </div>

    <script>
        // Chart.js script to draw sales graph
        const ctx = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['12 PM', '2 PM', '4 PM', '6 PM', '8 PM', '10 PM'],
                datasets: [{
                    label: 'Sales (in ₹)',
                    data: [500, 1200, 300, 800, 1500, 200],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            }
        });
    </script>
</body>
</html>
